<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FRAS — Login</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="stylesheet" href="style.css?v=4">

  <style>
    .password-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-box input {
      flex: 1;
      padding-right: 38px;
    }

    .toggle-password-btn {
      position: absolute;
      right: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #8a94a3;
      cursor: pointer;
    }

    .toggle-password-btn:hover {
      color: #444d5c;
      background: rgba(15, 23, 42, .06);
    }

    .toggle-password-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .toggle-password-btn .icon-eye-off {
      display: none;
    }

    .toggle-password-btn.showing .icon-eye {
      display: none;
    }

    .toggle-password-btn.showing .icon-eye-off {
      display: block;
    }
  </style>
</head>

<body class="centered">
  <form id="login-form" class="card">
    <img src="assets/logo/fras-logo-full.svg" alt="FRAS — Face Recognition Attendance System"
      style="display:block;width:230px;max-width:100%;margin:0 0 .35rem">
    <p class="muted">FYP-26-S2-17</p>

    <label>
      Email
      <input type="email" name="email" required value="admin@demo.local">
    </label>

    <label>
      Password
      <div class="password-box">
        <input id="password-input" type="password" name="password" required value="demo123">
        <button type="button" id="toggle-password-btn" class="toggle-password-btn" aria-label="Show password"
          title="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
      </div>
    </label>

    <button type="submit">Login</button>
    <p id="login-error" class="error"></p>
  </form>

  <script src="app.js?v=5"></script>

  <script>
    const passwordInput = document.getElementById("password-input");
    const toggleBtn = document.getElementById("toggle-password-btn");
    let passwordTimer;

    function hidePassword() {
      passwordInput.type = "password";
      toggleBtn.classList.remove("showing");
      toggleBtn.setAttribute("aria-label", "Show password");
      toggleBtn.title = "Show password";
    }

    toggleBtn.addEventListener("click", () => {
      clearTimeout(passwordTimer);

      if (toggleBtn.classList.contains("showing")) {
        hidePassword();
        return;
      }

      passwordInput.type = "text";
      toggleBtn.classList.add("showing");
      toggleBtn.setAttribute("aria-label", "Hide password");
      toggleBtn.title = "Hide password";

      // Auto-hide again after a short peek.
      passwordTimer = setTimeout(hidePassword, 2000);
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const fd = new FormData(e.target);
      const err = document.getElementById("login-error");
      err.textContent = "";

      try {
        const res = await api("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: fd.get("email"),
            password: fd.get("password")
          }),
        });

        localStorage.setItem("token", res.token);
        localStorage.setItem("user", JSON.stringify(res.user));

        const dest = {
          admin: "admin.html",
          teacher: "teacher.html",
          student: "student.html"
        };

        location.href = dest[res.user.role] || "student.html";

      } catch (ex) {
        err.textContent = ex.message;
      }
    });
  </script>
</body>

</html>
